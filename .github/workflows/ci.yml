name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RUN_MLX_INTEGRATION: "0"
      RUN_TOKENIZER_INTEGRATION: "0"
      RUN_CODE_INTEGRATION: "0"
      RUN_BENCHMARKS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked CPU test environment
        # Locked MLX wheels target macOS ARM64. Keep the production lock intact
        # and omit only the backend packages; CPU tests use fail-fast MLX stubs from conftest.py.
        run: uv sync --locked --python 3.11 --no-install-package mlx --no-install-package mlx-lm --no-install-package mlx-metal
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Formatting
        run: uv run --no-sync ruff format --check .
      - name: CPU tests
        run: uv run --no-sync pytest -m 'unit or api' -q
