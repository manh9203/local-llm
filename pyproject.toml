[project]
name = "local-llm"
version = "0.1.0"
description = "Local LLM on Apple Silicon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Manh Dinh", email = "manh9203@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "mlx-lm>=0.32.2",
    "openai>=3.31.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

addopts = "--strict-markers"
markers = [
    "unit: deterministic tests with no model weights or external services",
    "api: CPU HTTP integration with an injected fake engine",
    "mlx: real MLX inference; requires Apple Silicon and model weights",
    "tokenizer: real Hugging Face tokenizer; may require downloads",
    "docker: executable grader integration; requires Docker",
    "benchmark: performance measurement, excluded from routine tests",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]
